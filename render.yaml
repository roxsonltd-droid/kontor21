services:
  - type: web
    name: kontor21
    runtime: node
    region: frankfurt
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: kontor21-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: https://kontor21.onrender.com
      - key: AMOY_RPC_URL
        value: https://rpc-amoy.polygon.technology/
      - key: ESCROW_RPC_URL
        value: https://rpc-amoy.polygon.technology/
      - key: ESCROW_NETWORK
        value: polygon-amoy
      - key: API_CHAIN_ID
        value: "80002"
      - key: INDEXER_CONFIRMATIONS
        value: "12"
      - key: KONTOR_ESCROW_ADDRESS
        sync: false
      - key: ESCROW_START_BLOCK
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: POLYGONSCAN_API_KEY
        sync: false
      - key: ARBITRATOR_WALLETS
        sync: false

databases:
  - name: kontor21-db
    region: frankfurt
    databaseName: kontor21
    user: kontor21
